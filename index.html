<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Et Action</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@300;400;500&display=swap');
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root { --ink:#1a1714; --paper:#f5f0e8; --gold:#c9a84c; --gold-light:#e8d5a0; --red:#a63d2f; --green:#3a6b4a; --a1:#5c3d7a; --a1-text:#e8dcf0; --a2:#2c4a6e; --a2-text:#d0dcee; }
  body { background:var(--ink); font-family:'DM Mono',monospace; color:var(--paper); min-height:100vh; overflow-x:hidden; }
  body::before { content:''; position:fixed; inset:0; background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E"); pointer-events:none; z-index:100; opacity:0.4; }

  /* TABS */
  .tabs-bar { position:sticky; top:0; z-index:50; background:#111; border-bottom:1px solid #222; display:flex; justify-content:center; }
  .tab-btn { background:transparent; border:none; border-bottom:2px solid transparent; color:#444; font-family:'DM Mono',monospace; font-size:10px; letter-spacing:0.25em; text-transform:uppercase; padding:16px 32px; cursor:pointer; transition:all 0.2s; }
  .tab-btn:hover { color:#888; }
  .tab-btn.active { color:var(--gold); border-bottom-color:var(--gold); }
  .tab-pane { display:none; }
  .tab-pane.active { display:block; animation:fadeUp 0.4s ease both; }
  @keyframes fadeUp { from{opacity:0;transform:translateY(16px)} to{opacity:1;transform:translateY(0)} }

  /* LAYOUT */
  .app { max-width:900px; margin:0 auto; padding:40px 24px; }
  header { text-align:center; margin-bottom:48px; }
  header h1 { font-family:'DM Serif Display',serif; font-size:clamp(28px,5vw,48px); letter-spacing:-0.02em; color:var(--gold); line-height:1; margin-bottom:8px; }
  header p { font-size:11px; letter-spacing:0.2em; text-transform:uppercase; color:#666; margin-bottom:32px; }

  /* IMPRO */
  .timer-config { display:flex; align-items:center; justify-content:center; gap:12px; margin-bottom:16px; }
  .timer-config label { font-size:11px; letter-spacing:0.15em; text-transform:uppercase; color:#666; }
  .timer-config input { background:transparent; border:1px solid #333; color:var(--paper); font-family:'DM Mono',monospace; font-size:14px; padding:6px 10px; width:70px; text-align:center; border-radius:2px; outline:none; }
  .timer-config input:focus { border-color:var(--gold); }
  .btn-deal { display:block; margin:0 auto; background:var(--gold); color:var(--ink); border:none; font-family:'DM Mono',monospace; font-size:12px; font-weight:500; letter-spacing:0.2em; text-transform:uppercase; padding:14px 40px; cursor:pointer; border-radius:2px; transition:all 0.2s; }
  .btn-deal:hover { background:var(--gold-light); transform:translateY(-1px); }
  .cards-grid { display:none; }
  .cards-grid.visible { display:block; animation:fadeUp 0.5s ease both; }
  .section-label { font-size:9px; letter-spacing:0.3em; text-transform:uppercase; color:#333; margin-bottom:10px; padding-left:2px; }
  .actors-row { display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-bottom:20px; }
  @media(max-width:600px){.actors-row{grid-template-columns:1fr}}
  .actor-col { display:flex; flex-direction:column; gap:10px; }
  .actor-col-a1 { border-left:2px solid var(--a1); padding-left:12px; }
  .actor-col-a2 { border-left:2px solid var(--a2); padding-left:12px; }
  .actor-label { font-size:9px; letter-spacing:0.3em; text-transform:uppercase; padding-bottom:4px; }
  .actor-label-a1 { color:var(--a1); }
  .actor-label-a2 { color:var(--a2); }
  .card { border:1px solid #2a2a2a; border-radius:4px; overflow:hidden; transition:transform 0.2s; }
  .card:hover { transform:translateY(-2px); }
  .card-band { padding:8px 14px; display:flex; align-items:center; justify-content:space-between; }
  .card-band .type { font-size:9px; letter-spacing:0.25em; text-transform:uppercase; font-weight:500; opacity:0.9; }
  .band-right { display:flex; align-items:center; gap:6px; }
  .card-body { padding:18px 16px 20px; background:#111; }
  .card-title { font-family:'DM Serif Display',serif; font-size:17px; line-height:1.3; margin-bottom:8px; color:var(--paper); }
  .card-sub { font-size:11px; color:#888; font-style:italic; line-height:1.5; }
  .card-a1 .card-band { background:var(--a1); color:var(--a1-text); }
  .card-a2 .card-band { background:var(--a2); color:var(--a2-text); }
  .card-rel .card-band { background:#7a5c2e; color:#f0e0c0; }
  .card-situ .card-band { background:var(--green); color:#d8eedd; }
  .card-event .card-band { background:#222; color:#888; }
  .card-event.revealed .card-band { background:var(--red); color:#f5d0cc; }
  .card-secret .card-body { display:flex; align-items:center; justify-content:center; min-height:80px; cursor:pointer; user-select:none; background:#0d0d0d; transition:background 0.2s; }
  .card-secret .card-body:hover { background:#151515; }
  .card-secret .card-body .hint { font-size:10px; letter-spacing:0.2em; text-transform:uppercase; color:#444; text-align:center; display:flex; flex-direction:column; gap:4px; }
  .card-secret.open .card-body { display:block; cursor:default; background:#111; }
  .card-event .card-body { display:flex; align-items:center; justify-content:center; min-height:80px; background:#0a0a0a; }
  .card-event .lock-content { text-align:center; }
  .card-event .lock-content .countdown { font-size:28px; font-weight:300; color:#555; font-family:'DM Serif Display',serif; display:block; margin-bottom:4px; }
  .card-event .lock-content .lock-label { font-size:9px; letter-spacing:0.2em; text-transform:uppercase; color:#333; }
  .card-event.revealed .card-body { display:block; background:#120a0a; }
  .card-event.revealed .card-body .card-title { color:#f5d0cc; }
  .row { display:grid; gap:16px; margin-bottom:20px; }
  .row-1 { grid-template-columns:1fr; }
  @keyframes revealFlash{0%{opacity:0;transform:scale(.97)}60%{opacity:1;transform:scale(1.01)}100%{opacity:1;transform:scale(1)}}
  .card-event.revealed { animation:revealFlash 0.4s ease both; }
  .timer-section { margin:24px 0 16px; }
  .timer-bar-wrap { height:3px; background:#1e1e1e; border-radius:2px; overflow:hidden; margin-bottom:12px; }
  .timer-bar { height:100%; background:var(--gold); width:100%; transform-origin:left; transition:width 1s linear; }
  .timer-bar.danger { background:var(--red); }
  .timer-info { display:flex; justify-content:space-between; align-items:center; }
  .timer-display { font-size:13px; color:#777; }
  .timer-display span { color:var(--gold); font-size:18px; font-family:'DM Serif Display',serif; }
  .timer-display.danger span { color:var(--red); }
  .btn-start { background:transparent; border:1px solid #333; color:#888; font-family:'DM Mono',monospace; font-size:10px; letter-spacing:0.2em; text-transform:uppercase; padding:8px 16px; cursor:pointer; border-radius:2px; transition:all 0.2s; }
  .btn-start:hover { border-color:var(--gold); color:var(--gold); }
  .btn-start.running { border-color:var(--red); color:var(--red); }
  .bottom-bar { margin-top:32px; text-align:center; border-top:1px solid #1e1e1e; padding-top:24px; }
  .btn-redeal { background:transparent; border:1px solid #2a2a2a; color:#444; font-family:'DM Mono',monospace; font-size:10px; letter-spacing:0.2em; text-transform:uppercase; padding:10px 24px; cursor:pointer; border-radius:2px; transition:all 0.2s; }
  .btn-redeal:hover { border-color:#444; color:#888; }
  .btn-reroll { background:transparent; border:none; color:rgba(255,255,255,0.25); cursor:pointer; font-size:13px; padding:2px 4px; border-radius:2px; transition:color 0.15s; font-family:inherit; line-height:1; }
  .btn-reroll:hover { color:rgba(255,255,255,0.7); }

  /* ═══════════════════════════════
     À L'ÉCOUTE
  ═══════════════════════════════ */
  .ecoute-wrapper { display:flex; flex-direction:column; align-items:center; gap:28px; padding-bottom:60px; }

  /* flip card */
  .flip-scene { width:100%; max-width:520px; height:280px; perspective:1200px; cursor:pointer; }
  .flip-card { width:100%; height:100%; position:relative; transform-style:preserve-3d; transition:transform 0.6s cubic-bezier(0.4,0.2,0.2,1); }
  .flip-card.flipped { transform:rotateY(180deg); }
  .flip-face { position:absolute; inset:0; border-radius:8px; backface-visibility:hidden; -webkit-backface-visibility:hidden; overflow:hidden; border:1px solid #2a2a2a; }

  /* front */
  .flip-front { background:#0c0c0c; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:20px; }
  .flip-front .mystery-mark { font-family:'DM Serif Display',serif; font-size:88px; color:#252525; line-height:1; user-select:none; transition:color 0.2s; }
  .flip-scene:hover .mystery-mark { color:#333; }
  .flip-front .mystery-hint { font-size:10px; letter-spacing:0.25em; text-transform:uppercase; color:#2e2e2e; transition:color 0.2s; }
  .flip-scene:hover .mystery-hint { color:#444; }

  /* back */
  .flip-back { transform:rotateY(180deg); display:flex; flex-direction:column; }
  .flip-back-band { padding:12px 22px; display:flex; align-items:center; justify-content:space-between; flex-shrink:0; }
  .flip-back-band .cat-label { font-size:10px; letter-spacing:0.25em; text-transform:uppercase; font-weight:500; }
  .flip-back-band .cat-hint { font-size:9px; opacity:0.45; letter-spacing:0.1em; text-transform:uppercase; }
  .flip-back-body { flex:1; background:#0f0f0f; display:flex; align-items:center; padding:28px 30px; }
  .flip-back-phrase { font-family:'DM Serif Display',serif; font-size:clamp(22px,4vw,30px); line-height:1.3; color:var(--paper); }

  /* band colors */
  .band-choc        { background:#3d1a1a; color:#f5d0cc; }
  .band-culpa       { background:#2a2a1a; color:#e8e0b0; }
  .band-soulage     { background:#1a2e1a; color:#c0e8c0; }
  .band-trahison    { background:#1a1a3a; color:#c0c8f0; }
  .band-tendresse   { background:#2e1a2e; color:#e8c0e8; }
  .band-menace      { background:#111;    color:#888; border-bottom:1px solid #2a2a2a; }
  .band-honte       { background:#2a1a10; color:#e8c8a0; }
  .band-joie        { background:#1a2a10; color:#d0f0a0; }
  .band-fierte      { background:#1a2228; color:#a0d0e0; }
  .band-dispute     { background:#2a1010; color:#f0a0a0; }
  .band-frustration { background:#1e1e1e; color:#666; }

  /* solo bar */
  .solo-bar-wrap { width:100%; max-width:520px; height:2px; background:#1e1e1e; border-radius:1px; overflow:hidden; opacity:0; transition:opacity 0.3s; }
  .solo-bar-wrap.visible { opacity:1; }
  .solo-bar { height:100%; background:var(--gold); width:100%; }
  .solo-bar.danger { background:var(--red); }

  /* audio indicator */
  .audio-row { display:flex; align-items:center; gap:10px; }
  .audio-indicator { font-size:9px; letter-spacing:0.2em; text-transform:uppercase; color:#333; display:flex; align-items:center; gap:6px; transition:color 0.2s; }
  .audio-indicator.speaking { color:var(--gold); }
  .audio-dot { width:6px; height:6px; border-radius:50%; background:#333; transition:background 0.2s; }
  .audio-indicator.speaking .audio-dot { background:var(--gold); animation:pulse 0.8s infinite; }
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:0.3}}

  /* controls row */
  .ecoute-controls { width:100%; max-width:520px; display:flex; flex-direction:column; gap:16px; }
  .solo-row { display:flex; gap:12px; align-items:center; }
  .btn-solo { flex:1; background:transparent; border:1px solid #333; color:#666; font-family:'DM Mono',monospace; font-size:10px; letter-spacing:0.2em; text-transform:uppercase; padding:12px 16px; cursor:pointer; border-radius:2px; transition:all 0.2s; }
  .btn-solo:hover { border-color:var(--gold); color:var(--gold); }
  .btn-solo.active { background:var(--gold); color:var(--ink); border-color:var(--gold); }
  .solo-sec-row { display:flex; align-items:center; gap:8px; }
  .solo-sec-row label { font-size:10px; letter-spacing:0.15em; text-transform:uppercase; color:#444; }
  .solo-sec-row input { background:transparent; border:1px solid #2a2a2a; color:var(--paper); font-family:'DM Mono',monospace; font-size:13px; padding:6px 8px; width:58px; text-align:center; border-radius:2px; outline:none; }
  .solo-sec-row input:focus { border-color:var(--gold); }
  .btn-next { width:100%; background:transparent; border:1px solid #222; color:#444; font-family:'DM Mono',monospace; font-size:10px; letter-spacing:0.2em; text-transform:uppercase; padding:12px; cursor:pointer; border-radius:2px; transition:all 0.2s; }
  .btn-next:hover { border-color:#444; color:#888; }
</style>
</head>
<body>

<div class="tabs-bar">
  <button class="tab-btn active" onclick="switchTab('impro',this)">Jeux d'impro</button>
  <button class="tab-btn"        onclick="switchTab('ecoute',this)">À l'écoute</button>
</div>

<!-- ══ TAB 1 : IMPRO ══ -->
<div class="tab-pane active" id="tab-impro">
<div class="app">
  <header>
    <h1>Et Action !</h1>
    <p>Jeu d'impro · direction d'acteur</p>
    <div class="timer-config">
      <label>Événement dans</label>
      <input type="number" id="timerInput" value="120" min="10" max="600">
      <label>secondes</label>
    </div>
    <button class="btn-deal" onclick="deal()">Distribuer les cartes</button>
  </header>
  <div class="cards-grid" id="grid">
    <div class="section-label">Acteurs - personnage · objectif · contrainte</div>
    <div class="actors-row">
      <div class="actor-col actor-col-a1" id="actor1Col"></div>
      <div class="actor-col actor-col-a2" id="actor2Col"></div>
    </div>
    <div class="section-label">Relation entre les acteurs</div>
    <div class="row row-1" id="relRow"></div>
    <div class="section-label">Situation</div>
    <div class="row row-1" id="situRow"></div>
    <div class="timer-section">
      <div class="timer-bar-wrap"><div class="timer-bar" id="timerBar"></div></div>
      <div class="timer-info">
        <div class="timer-display" id="timerDisplay"><span id="timerCount">--</span> · événement verrouillé</div>
        <button class="btn-start" id="btnStart" onclick="toggleTimer()">▶ Démarrer</button>
      </div>
    </div>
    <div class="section-label">Événement</div>
    <div class="row row-1" id="eventRow"></div>
    <div class="bottom-bar">
      <button class="btn-redeal" onclick="deal()">↺ Nouvelle pioche</button>
    </div>
  </div>
</div>
</div>

<!-- ══ TAB 2 : ÉCOUTE ══ -->
<div class="tab-pane" id="tab-ecoute">
<div class="app">
  <header>
    <h1>À l'écoute</h1>
    <p>Exercice de réaction · close-up camera</p>
  </header>

  <div class="ecoute-wrapper">

    <div class="flip-scene" id="flipScene" onclick="flipCard()">
      <div class="flip-card" id="flipCard">
        <div class="flip-face flip-front">
          <div class="mystery-mark">?</div>
          <div class="mystery-hint">Retourner la carte</div>
        </div>
        <div class="flip-face flip-back">
          <div class="flip-back-band" id="flipBand">
            <span class="cat-label" id="flipCatLabel"></span>
            <span class="cat-hint">cliquer pour changer</span>
          </div>
          <div class="flip-back-body">
            <div class="flip-back-phrase" id="flipPhrase"></div>
          </div>
        </div>
      </div>
    </div>

    <div class="solo-bar-wrap" id="soloBarWrap">
      <div class="solo-bar" id="soloBar"></div>
    </div>

    <div class="audio-row">
      <div class="audio-indicator" id="audioInd">
        <div class="audio-dot"></div>
        <span id="audioLbl">audio prêt</span>
      </div>
    </div>

    <div class="ecoute-controls">
      <div class="solo-row">
        <button class="btn-solo" id="btnSolo" onclick="toggleSolo()">▶ Mode solo</button>
        <div class="solo-sec-row">
          <label>toutes les</label>
          <input type="number" id="soloSec" value="8" min="3" max="60">
          <label>sec</label>
        </div>
      </div>
      <button class="btn-next" onclick="nextCard()">↺ Nouvelle carte</button>
    </div>

  </div>
</div>
</div>

<script>
/* ── tabs ── */
function switchTab(id, btn) {
  document.querySelectorAll('.tab-pane').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('tab-' + id).classList.add('active');
  btn.classList.add('active');
}

  objectifs:[["Obtenir quelque chose sans le demander","Jamais directement"],["Faire partir l'autre sans lui dire pourquoi","Il ne doit pas comprendre"],["Avouer quelque chose sans jamais le dire","À mots couverts"],["Convaincre l'autre de rester","Coûte que coûte"],["Tester si l'autre peut être de confiance","Sans qu'il le sache"],["Cacher que tu as peur","Faire semblant d'être fort"],["Prendre une décision que tu repousses","C'est maintenant ou jamais"],["Faire comme si tout allait bien","Alors que rien ne va"],["Récupérer quelque chose qui t'appartient","Sans accusation"],["T'excuser sans jamais dire pardon","Trouver un autre chemin"],["Savoir si l'autre est au courant","Sans le lui demander"],["Repartir avec quelque chose que tu n'avais pas","Un objet, une info, une promesse"],["Gagner du temps","La raison n'a pas d'importance"],["Décider si tu peux faire confiance à cette personne","En une seule scène"],["Lui annoncer quelque chose sans le dire","Il doit comprendre seul"],["Te faire oublier le plus vite possible","Disparaître en douceur"],["Convaincre l'autre que tu vas bien","Même si tu mens"],["Empêcher l'autre de partir","Sans que ça soit visible"],["Trouver une information précise","Discrètement"],["Changer d'avis sur cette personne","En mieux ou en pire"]],
  relations:[["Vous vous êtes rencontrés une seule fois, il y a longtemps","Aucun des deux n'a oublié"],["Vous avez un ami commun que vous n'avez pas mentionné","Il sait des choses sur vous deux"],["Vous avez partagé quelque chose d'important sans jamais en parler","Ça n'a pas été dit"],["Vous ne vous connaissez pas, mais vous vous êtes déjà vus","Sans jamais vous adresser la parole"],["Vous avez travaillé ensemble, brièvement","Ça ne s'est pas bien terminé"],["Vous vous êtes disputés une fois, sérieusement","Aucun des deux n'a vraiment tourné la page"],["Vous avez en commun une perte que vous n'avez pas nommée","Chacun la porte à sa façon"],["Quelqu'un vous a mis en contact sans vous prévenir","Vous ne savez pas encore pourquoi"],["Vous partagez un secret que vous n'êtes pas censés connaître tous les deux","Ni l'un ni l'autre ne sait que l'autre sait"],["Vous vous étiez perdus de vue volontairement","Se retrouver ici n'était pas prévu"],["L'un de vous a rendu un service à l'autre, il y a longtemps","Sans attendre de retour"],["Vous avez failli vous rencontrer plusieurs fois avant aujourd'hui","Quelque chose avait toujours empêché"],["Vous avez un passé commun que l'un des deux préférerait oublier","L'autre s'en souvient très bien"],["Vous ne vous connaissez pas vraiment, mais vous savez des choses l'un sur l'autre","Via des tiers"]],
  contraintes:["Tu ne peux pas poser de questions directes","Tu ne peux pas t'asseoir ni t'appuyer sur quoi que ce soit","Chaque réplique doit être plus courte que la précédente","Tu ne peux jamais regarder l'autre dans les yeux plus de deux secondes","Tu dois tenir un objet en main en permanence","Tu ne peux pas dire « non » ni « jamais »","Tu parles toujours un peu trop vite, comme si tu manquais de temps","Tu ne peux pas prononcer le prénom de l'autre","Tu réponds systématiquement à côté avant de revenir au sujet","Tu dois rester debout et en mouvement constant","Tu n'achèves jamais complètement une phrase - tu t'arrêtes juste avant","Tu prends toujours trois secondes avant de répondre","Tu dois mentionner quelque chose de concret dans chaque réplique","Tu ne peux exprimer une émotion que par une action - jamais avec des mots","Tu évites tout contact physique, même accidentel","Tu parles toujours un peu moins fort que tu ne le ferais naturellement","Tu dois garder les bras croisés ou les mains dans les poches en permanence","Tu ne peux pas commencer une réplique avant que l'autre ait fini la sienne"],
  evenements:[["Un téléphone sonne - l'un des deux doit sortir","Il revient dans 30 secondes"],["La lumière s'éteint","Ou baisse brutalement"],["On frappe fort à la porte","Personne n'attend quelqu'un"],["Un objet tombe et se casse","Quelque chose d'important"],["L'un reçoit un message qui change tout","Il le lit devant l'autre"],["Il commence à pleuvoir très fort","Ils sont coincés"],["On entend des cris au loin","Puis silence"],["L'un doit partir dans exactement 2 minutes","Il vient de se souvenir"],["Un inconnu entre dans l'espace","Et repart sans un mot"],["Une annonce passe à la radio","Ils l'entendent tous les deux"],["L'un trouve quelque chose par terre","Un objet qui ne devrait pas être là"],["Le ton monte malgré eux","Ils ne le choisissent pas"],["Il fait soudainement très froid","Coupure de chauffage"],["Ce qu'ils attendaient arrive enfin","Une personne, un bruit, un signe"],["Quelqu'un qu'ils connaissent tous les deux passe","Ils le voient, il ne les voit pas"]],
};

function pick(arr, excl=[]) {
  const av = arr.filter((_,i)=>!excl.includes(i));
  const i = Math.floor(Math.random()*av.length);
  return [av[i], arr.indexOf(av[i])];
}

const st = {p1i:-1,p2i:-1,o1i:-1,o2i:-1,ri:-1,c1i:-1,c2i:-1,situi:-1,evi:-1};

function mkCard(type,title,sub,idx,secret,slot,actor) {
  const labels={perso:'Personnage',obj:'Objectif secret',relation:'Relation',contrainte:'Contrainte - Pas obligatoire',situ:'Situation'};
  const cc=actor?`card-${actor}`:`card-${type}`;
  const rr=`<button class="btn-reroll" onclick="reroll('${slot}',event)">↺</button>`;
  const lbl=labels[type]||type;
  if(secret) return `<div class="card ${cc} card-secret" id="card-${slot}"><div class="card-band"><span class="type">${lbl}</span><div class="band-right">${rr}</div></div><div class="card-body" onclick="revSec('card-${slot}',this)"><div class="hint">Appuyer pour révéler<br>à l'acteur concerné</div><div class="card-title" style="display:none">${title}</div>${sub?`<div class="card-sub" style="display:none">${sub}</div>`:''}</div></div>`;
  return `<div class="card ${cc}" id="card-${slot}"><div class="card-band"><span class="type">${lbl}</span><div class="band-right">${rr}</div></div><div class="card-body"><div class="card-title">${title}</div>${sub?`<div class="card-sub">${sub}</div>`:''}</div></div>`;
}

function mkEvCard(d) {
  const rr=`<button class="btn-reroll" onclick="reroll('ev',event)">↺</button>`;
  return `<div class="card card-event" id="eventCard"><div class="card-band"><span class="type">Événement</span><div class="band-right">${rr}</div></div><div class="card-body"><div class="lock-content"><span class="countdown" id="eventCountdown">--</span><span class="lock-label">Se révèle au démarrage du timer</span><button onclick="revEv()" style="margin-top:10px;background:transparent;border:1px solid #2a2a2a;color:#333;font-family:'DM Mono',monospace;font-size:9px;letter-spacing:.2em;text-transform:uppercase;padding:6px 14px;cursor:pointer;border-radius:2px" onmouseover="this.style.borderColor='#555';this.style.color='#777'" onmouseout="this.style.borderColor='#2a2a2a';this.style.color='#333'">Révéler maintenant</button></div><div class="card-title" style="display:none" id="eventTitle">${d[0]}</div><div class="card-sub" style="display:none" id="eventSub">${d[1]}</div></div></div>`;
}

function renderActor(n) {
  const a=`a${n}`,s=n===1;
  const pi=s?st.p1i:st.p2i,oi=s?st.o1i:st.o2i,ci=s?st.c1i:st.c2i;
  const p=DATA.personnages[pi],o=DATA.objectifs[oi],con=DATA.contraintes[ci];
  const sl=s?{p:'p1',o:'o1',c:'c1'}:{p:'p2',o:'o2',c:'c2'};
  return `<div class="actor-label actor-label-${a}">Acteur ${n}</div>${mkCard('perso',p[0],p[1],pi,true,sl.p,a)}${mkCard('obj',o[0],o[1],oi,true,sl.o,a)}${mkCard('contrainte',con,null,ci,true,sl.c,a)}`;
}

function reroll(slot,e) {
  e.stopPropagation();
  if(slot==='rel'){const[d,i]=pick(DATA.relations,[st.ri]);st.ri=i;repCard('card-rel','relation',d[0],d[1],i,false,'rel',null);return;}
  if(slot==='ev'){const[d,i]=pick(DATA.evenements);st.evi=i;document.getElementById('eventRow').innerHTML=mkEvCard(d);const ec=document.getElementById('eventCountdown');if(ec&&!evRev)ec.textContent=fmtT(iTRem);return;}
  const cfg={p1:{src:'personnages',ex:()=>[st.p2i],sk:'p1i',t:'perso',a:'a1',s:true,sb:true},p2:{src:'personnages',ex:()=>[st.p1i],sk:'p2i',t:'perso',a:'a2',s:true,sb:true},o1:{src:'objectifs',ex:()=>[st.o2i],sk:'o1i',t:'obj',a:'a1',s:true,sb:true},o2:{src:'objectifs',ex:()=>[st.o1i],sk:'o2i',t:'obj',a:'a2',s:true,sb:true},c1:{src:'contraintes',ex:()=>[st.c2i],sk:'c1i',t:'contrainte',a:'a1',s:true,sb:false},c2:{src:'contraintes',ex:()=>[st.c1i],sk:'c2i',t:'contrainte',a:'a2',s:true,sb:false},situ:{src:'situations',ex:()=>[],sk:'situi',t:'situ',a:null,s:false,sb:true}};
  const c=cfg[slot];if(!c)return;
  const[d,i]=pick(DATA[c.src],c.ex());st[c.sk]=i;
  const title=Array.isArray(d)?d[0]:d,sub=c.sb&&Array.isArray(d)?d[1]:null;
  repCard('card-'+slot,c.t,title,sub,i,c.s,slot,c.a);
}

function repCard(id,type,title,sub,idx,secret,slot,actor) {
  const el=document.getElementById(id);if(!el)return;
  el.outerHTML=mkCard(type,title,sub,idx,secret,slot,actor);
  const u=document.getElementById(id);if(!u)return;
  u.style.opacity='0';u.style.transform='scale(0.97)';
  requestAnimationFrame(()=>{u.style.transition='opacity 0.2s,transform 0.2s';u.style.opacity='1';u.style.transform='scale(1)';});
}

function revSec(id,bodyEl) {
  const card=document.getElementById(id);
  if(card.classList.contains('open')){card.classList.remove('open');bodyEl.querySelector('.hint').style.display='flex';bodyEl.querySelector('.card-title').style.display='none';const s=bodyEl.querySelector('.card-sub');if(s)s.style.display='none';}
  else{card.classList.add('open');bodyEl.querySelector('.hint').style.display='none';bodyEl.querySelector('.card-title').style.display='block';const s=bodyEl.querySelector('.card-sub');if(s)s.style.display='block';}
}

let iT=null,iTTotal=120,iTRem=120,evRev=false;

function deal() {
  clearInterval(iT);iT=null;evRev=false;
  iTTotal=parseInt(document.getElementById('timerInput').value)||120;iTRem=iTTotal;
  const[p1,p1i]=pick(DATA.personnages),[p2,p2i]=pick(DATA.personnages,[p1i]);
  const[o1,o1i]=pick(DATA.objectifs),[o2,o2i]=pick(DATA.objectifs,[o1i]);
  const[rel,ri]=pick(DATA.relations),[,c1i]=pick(DATA.contraintes),[,c2i]=pick(DATA.contraintes,[c1i]);
  const[situ,situi]=pick(DATA.situations),[ev,evi]=pick(DATA.evenements);
  Object.assign(st,{p1i,p2i,o1i,o2i,ri,c1i,c2i,situi,evi});
  document.getElementById('actor1Col').innerHTML=renderActor(1);
  document.getElementById('actor2Col').innerHTML=renderActor(2);
  document.getElementById('relRow').innerHTML=mkCard('relation',rel[0],rel[1],ri,false,'rel',null);
  document.getElementById('situRow').innerHTML=mkCard('situ',situ[0],situ[1],situi,false,'situ',null);
  document.getElementById('eventRow').innerHTML=mkEvCard(ev);
  document.getElementById('timerBar').style.width='100%';document.getElementById('timerBar').classList.remove('danger');
  document.getElementById('timerDisplay').classList.remove('danger');
  document.getElementById('timerDisplay').innerHTML=`<span id="timerCount">${fmtT(iTRem)}</span> · événement verrouillé`;
  document.getElementById('eventCountdown').textContent=fmtT(iTRem);
  const btn=document.getElementById('btnStart');btn.textContent='▶ Démarrer';btn.classList.remove('running');
  const grid=document.getElementById('grid');grid.classList.remove('visible');void grid.offsetWidth;grid.classList.add('visible');
}

function fmtT(s){const m=Math.floor(s/60),sec=s%60;return m>0?`${m}:${String(sec).padStart(2,'0')}`:`${sec}s`;}

function playRevSound(){try{const ctx=new(window.AudioContext||window.webkitAudioContext)();[[0,440,0.15],[0.18,554,0.15],[0.36,659,0.3]].forEach(([w,f,d])=>{const o=ctx.createOscillator(),g=ctx.createGain();o.connect(g);g.connect(ctx.destination);o.frequency.value=f;o.type='sine';g.gain.setValueAtTime(0,ctx.currentTime+w);g.gain.linearRampToValueAtTime(0.3,ctx.currentTime+w+0.02);g.gain.linearRampToValueAtTime(0,ctx.currentTime+w+d);o.start(ctx.currentTime+w);o.stop(ctx.currentTime+w+d+0.05);});}catch(e){}}

function revEv(){if(evRev)return;evRev=true;playRevSound();const card=document.getElementById('eventCard');card.classList.add('revealed');card.querySelector('.lock-content').style.display='none';document.getElementById('eventTitle').style.display='block';document.getElementById('eventSub').style.display='block';document.getElementById('timerDisplay').innerHTML=`<span>Événement révélé !</span>`;}

function toggleTimer(){
  if(iT){clearInterval(iT);iT=null;const btn=document.getElementById('btnStart');btn.textContent='▶ Reprendre';btn.classList.remove('running');return;}
  const btn=document.getElementById('btnStart');btn.textContent='⏸ Pause';btn.classList.add('running');
  iT=setInterval(()=>{
    iTRem--;const pct=(iTRem/iTTotal)*100;const bar=document.getElementById('timerBar');bar.style.width=pct+'%';
    const disp=document.getElementById('timerDisplay');if(pct<20){bar.classList.add('danger');disp.classList.add('danger');}
    if(iTRem>0){if(!evRev){disp.innerHTML=`<span id="timerCount">${fmtT(iTRem)}</span> · événement verrouillé`;const ec=document.getElementById('eventCountdown');if(ec)ec.textContent=fmtT(iTRem);}}
    else{clearInterval(iT);iT=null;btn.textContent='▶ Démarrer';btn.classList.remove('running');revEv();}
  },1000);
}

/* ══ ÉCOUTE ══ */
const ECOUTE=[
  {id:'choc',label:'Choc / sidération',css:'band-choc',phrases:["On a retrouvé ton frère.","C'est pas toi le père.","Il est mort cette nuit.","Elle t'a jamais aimé.","C'était lui depuis le début.","Y'a pas eu d'accident.","T'as un fils.","Il t'a dénoncé.","La maison brûle.","Ils ont tout enregistré.","Elle était enceinte.","C'est ton sang sur le couteau."]},
  {id:'culpa',label:'Culpabilité',css:'band-culpa',phrases:["Il t'attendait ce soir-là.","Tu m'as pas répondu à mon message.","Tu m'as lâché, c'est vraiment pas cool."]},
  {id:'soulage',label:'Soulagement brutal',css:'band-soulage',phrases:["C'était pas toi. On le sait maintenant.","Vous êtes innocent.","Votre fils… n'a plus de cancer."]},
  {id:'trahison',label:'Trahison',css:'band-trahison',phrases:["Elle était au courant depuis le début.","C'est pas toi le père.","Je t'ai trompé.","Je t'ai mal élevé."]},
  {id:'tendresse',label:'Tendresse inattendue',css:'band-tendresse',phrases:["Il a parlé de toi jusqu'à la fin.","Je te l'ai jamais dit mais… je t'aime.","Elle t'a regardé toute la soirée."]},
  {id:'menace',label:'Menace froide',css:'band-menace',phrases:["On sait où habite ta mère.","Je sais qu'elle va à l'école, ta fille.","La ville est pas sûre, on sait jamais ce qui peut arriver à ta femme."]},
  {id:'honte',label:'Honte',css:'band-honte',phrases:["Tout le monde a vu la vidéo.","Tu fais rire personne.","Tu m'as tellement mis la honte devant ma famille.","J'ai vu tes posts homophobes sur Facebook."]},
  {id:'joie',label:'Joie / bonheur',css:'band-joie',phrases:["T'as eu le rôle.","Elle a dit oui.","T'as gagné.","Ils veulent te revoir demain.","C'est une fille."]},
  {id:'fierte',label:'Fierté / reconnaissance',css:'band-fierte',phrases:["C'est toi qu'ils ont choisi parmi tous.","Ton père a regardé le film. Il a pleuré.","Elle est fière de toi."]},
  {id:'dispute',label:'Dispute / confrontation',css:'band-dispute',phrases:["T'avais promis. T'as pas tenu.","Je te crois plus.","C'est toujours pareil avec toi.","T'es jamais là quand ça compte.","Je t'ai vu.","Arrête de mentir.","Je vais pas m'excuser."]},
  {id:'frustration',label:'Frustration froide',css:'band-frustration',phrases:["On a donné ta place à quelqu'un d'autre.","C'est trop tard.","La décision est prise."]},
];

const ALL_PHRASES=[];
ECOUTE.forEach(cat=>cat.phrases.forEach(p=>ALL_PHRASES.push({phrase:p,label:cat.label,css:cat.css})));

let curIdx=-1, isFlipped=false, soloRunning=false, soloAF=null, soloStart=null;

function pickRand(excl){let i;do{i=Math.floor(Math.random()*ALL_PHRASES.length);}while(ALL_PHRASES.length>1&&i===excl);return i;}

function applyPhrase(idx){
  const item=ALL_PHRASES[idx];
  document.getElementById('flipPhrase').textContent=item.phrase;
  document.getElementById('flipCatLabel').textContent=item.label;
  document.getElementById('flipBand').className='flip-back-band '+item.css;
}

function flipCard(){
  if(!isFlipped){
    curIdx=pickRand(curIdx);applyPhrase(curIdx);
    document.getElementById('flipCard').classList.add('flipped');isFlipped=true;
    setTimeout(()=>speak(ALL_PHRASES[curIdx].phrase),500);
  } else { nextCard(); }
}

function nextCard(){
  const card=document.getElementById('flipCard');
  if(isFlipped){
    card.classList.remove('flipped');isFlipped=false;
    setTimeout(()=>{curIdx=pickRand(curIdx);applyPhrase(curIdx);card.classList.add('flipped');isFlipped=true;setTimeout(()=>speak(ALL_PHRASES[curIdx].phrase),500);},350);
  } else {
    curIdx=pickRand(curIdx);applyPhrase(curIdx);card.classList.add('flipped');isFlipped=true;
    setTimeout(()=>speak(ALL_PHRASES[curIdx].phrase),500);
  }
  if(soloRunning){soloStart=performance.now();}
}

/* TTS */
function speak(text){
  if(!window.speechSynthesis)return;
  window.speechSynthesis.cancel();
  const utt=new SpeechSynthesisUtterance(text);
  utt.lang='fr-FR';utt.rate=0.85;utt.pitch=1;
  const voices=window.speechSynthesis.getVoices();
  const fr=voices.find(v=>v.lang.startsWith('fr'));
  if(fr)utt.voice=fr;
  const ind=document.getElementById('audioInd'),lbl=document.getElementById('audioLbl');
  utt.onstart=()=>{ind.classList.add('speaking');lbl.textContent='lecture en cours';};
  utt.onend=utt.onerror=()=>{ind.classList.remove('speaking');lbl.textContent='audio actif';};
  window.speechSynthesis.speak(utt);
}

if(window.speechSynthesis){window.speechSynthesis.getVoices();window.speechSynthesis.onvoiceschanged=()=>window.speechSynthesis.getVoices();}

/* SOLO */
function toggleSolo(){
  soloRunning=!soloRunning;
  const btn=document.getElementById('btnSolo');
  const wrap=document.getElementById('soloBarWrap');
  if(soloRunning){
    btn.textContent='⏸ Pause solo';btn.classList.add('active');wrap.classList.add('visible');
    if(!isFlipped)nextCard(); else soloStart=performance.now();
    if(!soloStart)soloStart=performance.now();
    runSolo();
  } else {
    btn.textContent='▶ Mode solo';btn.classList.remove('active');wrap.classList.remove('visible');
    if(soloAF){cancelAnimationFrame(soloAF);soloAF=null;}
  }
}

function runSolo(){
  if(!soloRunning)return;
  const total=(parseInt(document.getElementById('soloSec').value)||8)*1000;
  const bar=document.getElementById('soloBar');
  function tick(now){
    if(!soloRunning)return;
    const elapsed=now-soloStart;
    const pct=Math.max(0,100-((elapsed/total)*100));
    bar.style.width=pct+'%';
    if(pct<25)bar.classList.add('danger');else bar.classList.remove('danger');
    if(elapsed>=total){soloStart=now;bar.classList.remove('danger');nextCard();}
    soloAF=requestAnimationFrame(tick);
  }
  soloAF=requestAnimationFrame(tick);
}
</script>
